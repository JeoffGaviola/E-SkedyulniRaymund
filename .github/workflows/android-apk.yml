name: Build Android APK

# Runs every time you push to main (or when you click "Run workflow" on GitHub).
# When it finishes, download the APK from the run's "Artifacts" section.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web app and copy it into the Android project
        run: pnpm android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: E-Skedyul-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
